name: Bump version

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: bump
        run: node scripts/bump-patch.mjs
      - name: Commit the patch bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package.json package-lock.json README.md
          git commit -m "Bump @shared-ui/react to ${{ steps.bump.outputs.version }}."
          git push
